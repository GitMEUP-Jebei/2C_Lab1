<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logout</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1d4ed8);
        color: #e2e8f0;
      }

      .card {
        width: min(90vw, 420px);
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 18px;
        padding: 32px 28px;
        text-align: center;
        box-shadow: 0 20px 40px rgba(15, 23, 42, 0.35);
      }

      .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 18px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgba(59, 130, 246, 0.15);
        font-size: 2rem;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
      }

      p {
        margin: 0 0 24px;
        color: #cbd5e1;
        line-height: 1.6;
      }

      .btn {
        display: inline-block;
        padding: 12px 22px;
        border: none;
        border-radius: 10px;
        background: #3b82f6;
        color: white;
        font-size: 1rem;
        cursor: pointer;
        text-decoration: none;
        transition: 0.2s ease;
      }

      .btn:hover {
        background: #2563eb;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">👋</div>
      <h1>Logged Out</h1>
      <p>
        You have successfully signed out of your account.<br />
        Thank you for using our app.
      </p>
      <a href="login.html" class="btn">Back to Login</a>
    </div>
  </body>
</html>
